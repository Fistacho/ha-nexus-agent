name: Nexus Agent
version: "0.20.0"
slug: nexus_agent
description: "MCP server for Home Assistant — 323 tools across 29 domains. New in 0.20.0: section-aware Lovelace editing (dashboards_get_view_sections, dashboards_add_card_to_section, dashboards_update_card_in_section, dashboards_remove_card_from_section, dashboards_add_section_to_view) — cards can finally be placed on `type: sections` views, plus fixes for ~20 broken tools and a security fix restricting the Setup UI / key regeneration to ingress or an authenticated caller (rotate your API key after upgrading — see CHANGELOG)"
url: https://github.com/Fistacho/ha-nexus-agent
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
host_network: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

options:
  port: 7123
  log_level: info
  git_versioning_auto: true
  max_backups: 30
  api_key: ""

schema:
  port: int
  log_level: list(debug|info|warning|error)
  git_versioning_auto: bool
  max_backups: int
  api_key: str?

ports:
  7123/tcp: 7123

ports_description:
  7123/tcp: Nexus Agent — MCP + Setup UI

map:
  - config:rw

ingress: true
ingress_port: 7123
panel_icon: mdi:robot
panel_title: Nexus
watchdog: "http://[HOST]:[PORT:7123]/health"
