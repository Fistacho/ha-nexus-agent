name: Nexus Agent
version: "0.23.0"
slug: nexus_agent
description: "MCP server for Home Assistant — 323 tools across 29 domains. New in 0.23.0: ESPHome compile/validate/OTA upload work in the add-on via the Device Builder's trusted ingress site (add-on now uses host network)"
url: https://github.com/Fistacho/ha-nexus-agent
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
# ADR-0004: host_network is required so nexus can reach the ESPHome Device
# Builder's trusted-peer site ingress (127.0.0.1:<its ingress_port>) the same
# way HA Core does. Docker no longer maps `ports:` below once this is true —
# `addon_network.py` reconstructs the Network tab's LAN-port semantics at
# startup from `GET /addons/self/info` instead (see its module docstring).
# Do not change the `port` option below to work around this: `ingress_port`
# stays pinned at 7123 regardless, and `port` is scheduled for removal in
# 1.0.0 (see translations/en.yaml).
host_network: true
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

options:
  port: 7123
  log_level: info
  git_versioning_auto: true
  max_backups: 30
  api_key: ""
  read_only: false
  disabled_namespaces: []

schema:
  port: int
  log_level: list(debug|info|warning|error)
  git_versioning_auto: bool
  max_backups: int
  api_key: str?
  read_only: bool
  disabled_namespaces:
    - str

ports:
  7123/tcp: 7123

ports_description:
  7123/tcp: Nexus Agent — MCP + Setup UI

map:
  - config:rw

ingress: true
ingress_port: 7123
panel_icon: mdi:robot
panel_title: Nexus
watchdog: "http://[HOST]:[PORT:7123]/health"
