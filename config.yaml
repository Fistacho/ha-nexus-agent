name: Nexus Agent
version: "0.22.1"
slug: nexus_agent
description: "MCP server for Home Assistant — 323 tools across 29 domains. New in 0.22.1 (includes 0.22.0): read-only mode and per-namespace disabling, confirm gates on backup/config-file deletion, safer section-by-section dashboard edits, and a fix for the add-on image failing to build under the Supervisor"
url: https://github.com/Fistacho/ha-nexus-agent
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
host_network: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

options:
  port: 7123
  log_level: info
  git_versioning_auto: true
  max_backups: 30
  api_key: ""
  read_only: false
  disabled_namespaces: []

schema:
  port: int
  log_level: list(debug|info|warning|error)
  git_versioning_auto: bool
  max_backups: int
  api_key: str?
  read_only: bool
  disabled_namespaces:
    - str

ports:
  7123/tcp: 7123

ports_description:
  7123/tcp: Nexus Agent — MCP + Setup UI

map:
  - config:rw

ingress: true
ingress_port: 7123
panel_icon: mdi:robot
panel_title: Nexus
watchdog: "http://[HOST]:[PORT:7123]/health"
