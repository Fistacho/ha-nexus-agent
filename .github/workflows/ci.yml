name: CI

# All third-party actions are pinned to a commit SHA (with the human-readable tag
# in a trailing comment) per this repo's release process
# (.claude/hooks / pre-push-guard) — verified against each action's own tag refs
# via `gh api repos/<owner>/<repo>/tags` at the time this workflow was written,
# not copied from memory.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff — required, see pyproject.toml [tool.ruff])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "ruff==0.16.1"
      # Blocking: the CI-B cleanup pass (0.22.0) fixed or justified (with an
      # inline `# noqa` and rationale) every pre-existing finding this job used
      # to tolerate — `ruff check .` is clean and this job fails the build on
      # any new regression.
      - run: ruff check .

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -n auto

  build-smoke:
    name: Build amd64 image + /health smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # No build.yaml / ARG BUILD_FROM in this repo (see Dockerfile header and
      # tests/test_build_image_consistency.py — reverted in 0.22.1). The Dockerfile's
      # FROM is a literal (`python:3.12-alpine`), so this job needs no build-arg to
      # match what the real Supervisor does: passing one here that the real Supervisor
      # doesn't (or vice versa) is exactly how the 0.22.0 regression went uncaught by
      # this job while still breaking `update.install` on a live instance.
      - name: Build image (amd64, local docker load only — no push)
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: amd64
          context: .
          image: nexus-ci-smoke
          image-tags: |
            smoke
          version: ci-smoke
          push: false
          load: true
          cosign: false
          # Required by the action's schema even though push=false (no login is
          # attempted unless push=true) — GITHUB_TOKEN is always available.
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test — run the image and poll /health
        run: |
          set -eu
          # run.sh always exports HA_URL=http://supervisor/core itself (Supervisor
          # add-on mode) regardless of any -e HA_URL passed here, so there's no
          # point setting it; HA_TOKEN is passed through untouched by run.sh and is
          # only needed so auth.get_ha_token() doesn't raise during startup — /health
          # itself doesn't require reaching a real HA instance. Without SUPERVISOR_TOKEN
          # set (this container isn't started by the real Supervisor), server.py's main()
          # only enters HTTP/uvicorn mode when NEXUS_HTTP is also set — otherwise it runs
          # as a stdio MCP server and never binds port 7123 at all (see server.py, "HTTP
          # mode: add-on or explicit NEXUS_HTTP=1").
          docker run -d --name nexus-smoke \
            -p 7123:7123 \
            -e HA_TOKEN=smoke-test-token \
            -e NEXUS_HTTP=1 \
            nexus-ci-smoke:smoke

          ok=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7123/health || echo "000")
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "::error::nexus-smoke never returned HTTP 200 from /health"
            docker logs nexus-smoke || true
            exit 1
          fi
          echo "nexus-smoke is healthy (HTTP 200 from /health)"

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs nexus-smoke || true
