[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-nexus-agent"
version = "0.21.0"
description = "Nexus — MCP server for Home Assistant; 323 tools across 29 domains for AI control of your smart home"
authors = [{ name = "Łukasz Żochowski" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["home-assistant", "mcp", "model-context-protocol", "smart-home", "ai", "claude", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.4,<4",
    "mcp>=1.27,<2",
    "pydantic>=2,<3",
    "httpx>=0.27.0,<1",
    "websockets>=12.0,<17",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0.0,<2",
    "gitpython>=3.1.40,<4",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
nexus = "server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["."]
